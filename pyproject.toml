[project]
name = "ai-drama-system"
version = "0.0.0"
description = "AI Drama System Django runtime bootstrap"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
